name: Release macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release macOS App
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version

      - name: Ensure Xcode 15/16 Compatibility
        run: |
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' ClipEdit.xcodeproj/project.pbxproj || true

      - name: Import Apple Certificate (if secret is configured)
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Build Application (Release)
        run: |
          xcodebuild -project ClipEdit.xcodeproj \
            -scheme ClipEdit \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Sign App
        env:
          HAS_CERT: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "$HAS_CERT" ]; then
            echo "Signing with Apple Developer Certificate..."
            codesign --force --deep --options runtime -s "Apple Development: Gustavo Benitez (LQQ6TWZK73)" ./build/Build/Products/Release/ClipEdit.app
          else
            echo "Signing with Ad-hoc signature..."
            codesign --force --deep -s - ./build/Build/Products/Release/ClipEdit.app
          fi
          codesign -dvv ./build/Build/Products/Release/ClipEdit.app

      - name: Package App as ZIP
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.0.0"
          fi
          ditto -c -k --sequesterRsrc --keepParent \
            ./build/Build/Products/Release/ClipEdit.app \
            ./ClipEdit-${TAG_NAME}-macOS.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ClipEdit-*-macOS.zip
          name: Hubeet ClipEdit ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Hubeet ClipEdit ✂️📋
            > Ephemeral clipboard editor & transformer between Copy and Paste for macOS.

            ### 🚀 Quick Start
            1. Download and unzip `ClipEdit-${{ github.ref_name }}-macOS.zip`.
            2. Move `ClipEdit.app` to your `/Applications` folder.
            3. Since this build is community-distributed, on first run:
               - Right-click `ClipEdit.app` → select **Open** → click **Open**, or
               - Run `xattr -cr /Applications/ClipEdit.app` in Terminal.
            4. Press **⌘ + ⇧ + C** anywhere across macOS to edit your clipboard!

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f $RUNNER_TEMP/build_certificate.p12
