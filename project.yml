name: ClipEdit
options:
  bundleIdPrefix: com.clipedit
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  ClipEdit:
    type: application
    platform: macOS
    sources:
      - path: Sources/ClipEdit
    info:
      path: Sources/ClipEdit/Resources/Info.plist
      properties:
        CFBundleName: "Hubeet ClipEdit"
        CFBundleDisplayName: "Hubeet ClipEdit"
        CFBundleIdentifier: "com.clipedit.ClipEdit"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleIconFile: "AppIcon"
        CFBundleIconName: "AppIcon"
        LSUIElement: true
        NSHighResolutionCapable: true
    entitlements:
      path: Sources/ClipEdit/Resources/ClipEdit.entitlements
    settings:
      base:
        PRODUCT_NAME: ClipEdit
        PRODUCT_BUNDLE_IDENTIFIER: com.clipedit.ClipEdit
        ENABLE_HARDENED_RUNTIME: YES
        DEFINES_MODULE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ClipEditTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: ClipEdit
    settings:
      base:
        PRODUCT_NAME: ClipEditTests
        PRODUCT_BUNDLE_IDENTIFIER: com.clipedit.ClipEditTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ClipEdit.app/Contents/MacOS/ClipEdit"
        BUNDLE_LOADER: "$(TEST_HOST)"
